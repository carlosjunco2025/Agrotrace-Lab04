{% extends 'agrotrace/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Confirmar eliminación</h4>
            </div>
            <div class="card-body">
                <p>¿Está seguro que desea eliminar la asignación de <b>{{ object.certificacion.nombre_certificacion }}</b> al lote <b>{{ object.lote.codigo_lote }}</b>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'agrotrace:certificacionlote_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
